name: 배포 이미지 빌드·푸시

# main에 push되면 백엔드·프론트엔드 Docker 이미지를 빌드해 Docker Hub에 푸시한다.
# dev 배포는 ~/0.service/astro-trade/deploy.sh가 이미지를 pull해서 실행한다.
#
# 필요한 저장소 secrets / variables (GitHub 저장소 Settings에서 설정):
#   secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_PASSWORD
#   vars.DOCKER_REPOSITORY        = dirmich/astrob   (백엔드)
#   vars.DOCKER_FRONT_REPOSITORY  = dirmich/astro    (프론트엔드)
#   vars.VITE_API_BASE_URL        = https://astrob.lab.highmaru.com/api
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_REPOSITORY }}:latest
            ${{ vars.DOCKER_REPOSITORY }}:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          push: true
          tags: |
            ${{ vars.DOCKER_FRONT_REPOSITORY }}:latest
            ${{ vars.DOCKER_FRONT_REPOSITORY }}:${{ github.sha }}
